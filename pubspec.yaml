name: monte
description: "Monte: extrato e gestão financeira (teste técnico Flutter)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Pinned: 7.x is a full rewrite with a different API (see docs/adr).
  flutter_modular: 6.4.1
  intl: ^0.20.3
  meta: ^1.19.0
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.9.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  local_auth: ^3.0.2
  shared_preferences: ^2.5.6
  local_auth_android: ^2.3.0
  syncfusion_flutter_charts: ^35.1.43
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.2
  bloc: ^9.2.1
  lottie: ^3.8.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
flutter:
  # `flutter run` and `flutter test integration_test` build the dev flavor
  # unless told otherwise (`--flavor prod`).
  default-flavor: dev
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt
    - assets/lottie/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# Bundle SQLite3MultipleCiphers instead of plain SQLite, so the local
# database is encrypted at rest (key kept in the platform keystore).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
